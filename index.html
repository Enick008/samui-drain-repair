<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งซ่อมฝาท่อระบายน้ำ - เทศบาลนครเกาะสมุย</title>
    <!-- Tailwind CSS สำหรับดีไซน์ที่สวยงาม ทันสมัย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen py-8 px-4">

    <div class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">
        <!-- Header ส่วนหัวระบบ -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">ระบบแจ้งซ่อมฝาท่อระบายน้ำ</h1>
            <p class="text-blue-100 text-sm mt-1">เทศบาลนครเกาะสมุย</p>
        </div>

        <!-- ฟอร์มแจ้งซ่อม -->
        <form id="repairForm" class="p-6 md:p-8 space-y-5">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- รหัสรายงาน (Auto Generate) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รหัสรายงาน (ใช้อ้างอิง)</label>
                    <input type="text" id="reportId" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg px-4 py-2 text-slate-600 font-mono text-sm cursor-not-allowed">
                </div>

                <!-- วันที่และเวลาแจ้ง -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">วันที่และเวลาแจ้ง</label>
                    <input type="text" id="reportDate" readonly class="w-full bg-slate-100 border border-slate-300 rounded-lg px-4 py-2 text-slate-600 text-sm cursor-not-allowed">
                </div>

                <!-- ชื่อผู้แจ้ง -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้แจ้ง / หน่วยงาน <span class="text-red-500">*</span></label>
                    <input type="text" id="informant" required value="เทศบาลนครเกาะสมุย" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- เบอร์โทร -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ <span class="text-red-500">*</span></label>
                    <input type="tel" id="phone" required value="077421421" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- ตำบล -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ตำบล <span class="text-red-500">*</span></label>
                    <select id="district" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="บ่อผุด">บ่อผุด</option>
                        <option value="อ่างทอง">อ่างทอง</option>
                        <option value="แม่น้ำ">แม่น้ำ</option>
                        <option value="มะเร็ต">มะเร็ต</option>
                        <option value="ลิปะน้อย">ลิปะน้อย</option>
                        <option value="ตลิ่งงาม">ตลิ่งงาม</option>
                        <option value="หน้าเมือง">หน้าเมือง</option>
                    </select>
                </div>

                <!-- ลักษณะการชำรุด -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ลักษณะการชำรุด <span class="text-red-500">*</span></label>
                    <select id="damageType" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="ฝาชำรุด">ฝาชำรุด</option>
                        <option value="ฝาหาย">ฝาหาย</option>
                        <option value="ส่งเสียงดังรบกวน">ส่งเสียงดังรบกวน</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
            </div>

            <!-- ตำแหน่ง / จุดสังเกต -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ตำแหน่ง / จุดสังเกต (ถนน, ซอย, สถานที่ใกล้เคียง) <span class="text-red-500">*</span></label>
                <input type="text" id="locationDesc" required placeholder="เช่น หน้าเซเว่น ถนนสายบางรักษ์-บ่อนไก่" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- ส่วนพิกัด GPS -->
            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-3">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <span class="text-sm font-semibold text-slate-700">พิกัดจุดเกิดเหตุ (GPS Coordinates)</span>
                    <button type="button" onclick="getLocation()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1 shadow-sm font-medium">
                        📍 ดึงพิกัดปัจจุบันอัตโนมัติ
                    </button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">ละติจูด (Latitude)</label>
                        <input type="text" id="latitude" placeholder="9.5120..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">ลองจิจูด (Longitude)</label>
                        <input type="text" id="longitude" placeholder="100.0630..." class="w-full bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-sm">
                    </div>
                </div>
            </div>

            <!-- รายละเอียดเพิ่มเติม -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียดเพิ่มเติม / หมายเหตุ</label>
                <textarea id="note" rows="2" placeholder="เช่น จำนวนฝาที่ชำรุด หรือข้อมูลสำรวจเพิ่มเติม" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>

            <!-- ปุ่มกดส่งข้อมูล -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <button type="reset" class="px-5 py-2.5 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 transition text-sm">ล้างฟอร์ม</button>
                <button type="submit" id="submitBtn" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow-md transition text-sm flex items-center gap-2">
                    <span>บันทึกข้อมูลแจ้งซ่อม</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Script สำหรับทำงานและเชื่อมต่อ Web App -->
    <script>
        // กำหนด Web App URL ของคุณเอ็นตรงนี้
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxFTGt_D8pve1NMvYx5Vj-47Er1OnJGfD4aXg3nkwoamBhCsYETAlpttdun2nXTpk_X/exec";

        // สร้างรหัสรายงานอัตโนมัติ (Format: RYYYYMMDD-HHMMSS) และใส่วันที่ปัจจุบัน
        function generateReportId() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const reportId = `R${year}${month}${day}-${hours}${minutes}${seconds}`;
            document.getElementById('reportId').value = reportId;

            const dateStr = `${day}/${month}/${year}, ${hours}:${minutes}:${seconds}`;
            document.getElementById('reportDate').value = dateStr;
        }

        window.onload = generateReportId;

        // ฟังก์ชันดึงพิกัด GPS ปัจจุบัน
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('latitude').value = position.coords.latitude;
                        document.getElementById('longitude').value = position.coords.longitude;
                        alert('ดึงพิกัด GPS สำเร็จ!');
                    },
                    (error) => {
                        alert('ไม่สามารถดึงพิกัดได้: กรุณาอนุญาตการเข้าถึงตำแหน่ง GPS บนเบราว์เซอร์');
                    }
                );
            } else {
                alert('เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง GPS');
            }
        }

        // จัดการการส่งข้อมูลฟอร์มยิงเข้า Apps Script (Web App)
        document.getElementById('repairForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span>กำลังบันทึกข้อมูล...</span>`;

            const formData = {
                reportId: document.getElementById('reportId').value,
                reportDate: document.getElementById('reportDate').value,
                informant: document.getElementById('informant').value,
                phone: document.getElementById('phone').value,
                district: document.getElementById('district').value,
                damageType: document.getElementById('damageType').value,
                locationDesc: document.getElementById('locationDesc').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value,
                note: document.getElementById('note').value
            };

            // ส่งข้อมูลด้วย fetch API แบบ POST (No-cors หรือรับ JSON ผ่าน Apps Script)
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // ป้องกันปัญหา CORS บน Browser
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(() => {
                alert(`บันทึกข้อมูลแจ้งซ่อมสำเร็จ!\nรหัสอ้างอิง: ${formData.reportId}`);
                this.reset();
                generateReportId(); // สร้างรหัสใหม่สำหรับรายการถัดไป
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>บันทึกข้อมูลแจ้งซ่อม</span>`;
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>บันทึกข้อมูลแจ้งซ่อม</span>`;
            });
        });
    </script>
</body>
</html>
